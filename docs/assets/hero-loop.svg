      <animateTransform attributeName="transform" type="translate" values="452,188;452,158;452,158;452,188" keyTimes="0;0.25;0.85;1" dur="6s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.85;1" dur="6s" begin="0.35s" repeatCount="indefinite"/>
