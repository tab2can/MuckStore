  <text x="92" y="42" fill="#9aa4b7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" letter-spacing="3">STORE</text>
  <g transform="translate(900,28)">
    <circle r="7" fill="#6ecf9a">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="36" y="72" width="168" height="428" rx="16" fill="#121820" stroke="#243040"/>
