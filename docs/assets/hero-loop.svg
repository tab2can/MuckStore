  <text x="78" y="154" fill="#9aa4b7" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Library</text>
  <text x="78" y="194" fill="#9aa4b7" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Themes</text>
