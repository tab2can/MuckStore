<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-label="Discover, verify, install, run">
  <rect width="960" height="220" rx="20" fill="#0b0e14"/>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <g transform="translate(36,36)">
      <rect width="200" height="148" rx="16" fill="#161c26" stroke="#2a3342"/>
      <text x="100" y="48" text-anchor="middle" fill="#dcb06a" font-size="12" letter-spacing="2">01</text>
      <text x="100" y="84" text-anchor="middle" fill="#f3efe8" font-size="20" font-weight="600">Discover</text>
      <text x="100" y="112" text-anchor="middle" fill="#9aa4b7" font-size="12">GitHub topic search</text>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(265,36)">
      <rect width="200" height="148" rx="16" fill="#161c26" stroke="#2a3342"/>
      <text x="100" y="48" text-anchor="middle" fill="#dcb06a" font-size="12" letter-spacing="2">02</text>
      <text x="100" y="84" text-anchor="middle" fill="#f3efe8" font-size="20" font-weight="600">Verify</text>
      <text x="100" y="112" text-anchor="middle" fill="#9aa4b7" font-size="12">Attest + approve</text>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="1s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(494,36)">
      <rect width="200" height="148" rx="16" fill="#161c26" stroke="#2a3342"/>
      <text x="100" y="48" text-anchor="middle" fill="#dcb06a" font-size="12" letter-spacing="2">03</text>
      <text x="100" y="84" text-anchor="middle" fill="#f3efe8" font-size="20" font-weight="600">Install</text>
      <text x="100" y="112" text-anchor="middle" fill="#9aa4b7" font-size="12">Hash-pinned payload</text>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(723,36)">
      <rect width="200" height="148" rx="16" fill="#161c26" stroke="#2a3342"/>
      <text x="100" y="48" text-anchor="middle" fill="#dcb06a" font-size="12" letter-spacing="2">04</text>
      <text x="100" y="84" text-anchor="middle" fill="#f3efe8" font-size="20" font-weight="600">Run</text>
      <text x="100" y="112" text-anchor="middle" fill="#9aa4b7" font-size="12">Start, args, updates</text>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="3s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
