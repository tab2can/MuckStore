[workspace]
members = [".", "updater"]
resolver = "2"

[package]
name = "muck-store"
version = "1.0.3"
description = "Open-source program store and distribution layer"
authors = ["Muck Store contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "muck_store_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
semver = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
urlencoding = "2"
base64 = "0.22"
parking_lot = "0.12"
fs_extra = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
